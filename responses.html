<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Response Viewer</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #161d31;
    --panel-2: #1d2541;
    --border: #2a3454;
    --text: #e4e9f2;
    --muted: #8893b4;
    --soft: #b6bfd9;
    --accent: #4dabf7;
    --green: #51cf66;
    --red: #ff6b6b;
    --yellow: #ffd43b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0 0 8px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  header code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  .container { max-width: 1000px; margin: 0 auto; padding: 24px; }

  .upload-zone {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 24px;
    text-align: center;
    background: var(--panel);
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: var(--panel-2);
  }
  .upload-zone input[type=file] { display: none; }
  .upload-zone .icon { font-size: 28px; margin-bottom: 8px; }
  .upload-zone p { margin: 0; color: var(--soft); }
  .upload-zone .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .summary {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--soft);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .summary strong { color: var(--text); }
  .summary .filename { margin-left: auto; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  .item {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .item-header {
    padding: 12px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .item-index { font-size: 13px; color: var(--muted); font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
  }
  .badge.helpful { color: var(--green); border-color: var(--green); background: rgba(81, 207, 102, 0.1); }
  .badge.unhelpful { color: var(--red); border-color: var(--red); background: rgba(255, 107, 107, 0.1); }
  .badge.unrated { color: var(--yellow); border-color: var(--yellow); background: rgba(255, 212, 59, 0.1); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .item-body { padding: 16px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .text {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
    color: var(--soft);
  }

  .error {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 8px;
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>Response Viewer</h1>
  <p>Upload a JSON array of <code>{ prompt, response, helpful }</code> objects to review them.</p>
</header>
<main class="container">
  <label class="upload-zone" id="uploadZone">
    <div class="icon">📁</div>
    <p><strong>Click to choose a JSON file</strong> or drag and drop</p>
    <div class="hint">Expecting an array of objects with prompt, response, and a nullable helpful boolean.</div>
    <input type="file" id="fileInput" accept="application/json,.json" />
  </label>

  <div id="error" class="error" style="display:none"></div>
  <div id="summary" class="summary" style="display:none"></div>
  <div id="items"></div>
</main>

<script>
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const errorEl = document.getElementById('error');
  const summaryEl = document.getElementById('summary');
  const itemsEl = document.getElementById('items');

  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('dragover');
  });
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleFile(file);
  });

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    summaryEl.style.display = 'none';
    itemsEl.innerHTML = '';
  }

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) {
          showError('Expected a JSON array at the top level.');
          return;
        }
        render(data, file.name);
      } catch (err) {
        showError('Could not parse JSON: ' + err.message);
      }
    };
    reader.onerror = () => showError('Could not read the file.');
    reader.readAsText(file);
  }

  function helpfulBadge(helpful) {
    if (helpful === true) {
      return `<span class="badge helpful"><span class="dot"></span>Helpful</span>`;
    }
    if (helpful === false) {
      return `<span class="badge unhelpful"><span class="dot"></span>Not helpful</span>`;
    }
    return `<span class="badge unrated"><span class="dot"></span>Unrated</span>`;
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function render(items, filename) {
    errorEl.style.display = 'none';

    const total = items.length;
    const helpful = items.filter(i => i.helpful === true).length;
    const unhelpful = items.filter(i => i.helpful === false).length;
    const unrated = total - helpful - unhelpful;

    summaryEl.style.display = 'flex';
    summaryEl.innerHTML = `
      <span><strong>${total}</strong> total</span>
      <span><strong>${helpful}</strong> helpful</span>
      <span><strong>${unhelpful}</strong> not helpful</span>
      <span><strong>${unrated}</strong> unrated</span>
      <span class="filename">${escapeHtml(filename)}</span>
    `;

    itemsEl.innerHTML = items.map((item, i) => `
      <article class="item">
        <div class="item-header">
          <span class="item-index">#${i + 1}</span>
          ${helpfulBadge(item.helpful)}
        </div>
        <div class="item-body">
          <div class="field">
            <div class="label">Prompt</div>
            <div class="text">${escapeHtml(item.prompt)}</div>
          </div>
          <div class="field">
            <div class="label">Response</div>
            <div class="text">${escapeHtml(item.response)}</div>
          </div>
        </div>
      </article>
    `).join('');
  }
</script>
</body>
</html>
